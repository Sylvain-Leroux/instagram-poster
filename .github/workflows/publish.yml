name: Instagram posten

on:
  schedule:
    - cron: "31 * * * *"   # jede Stunde, Minute 31, damit 18:30-Posts direkt rausgehen
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nichts posten"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Faellige Posts veroeffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python3 scripts/publish.py

      - name: Ordner verschieben und speichern
        if: always()
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add -A queue posted failed 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Posts verarbeitet"
            git push
          fi
